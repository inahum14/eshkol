<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2A0A3C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="אני כאן" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>אני כאן</title>
  </head>
  <body>
    <div id="root"><div class="splash"><div class="splash-glow"></div><svg class="splash-pin" width="84" height="96" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 33C15 33 2 20.5 2 12.5C2 5.6 7.8 1 15 1s13 4.6 13 11.5C28 20.5 15 33 15 33Z" fill="#F0C96A"/><path class="splash-heart" d="M15 18.6c-.3 0-4.6-2.8-4.6-5.6 0-1.5 1.1-2.6 2.5-2.6.9 0 1.6.5 2.1 1.2.5-.7 1.2-1.2 2.1-1.2 1.4 0 2.5 1.1 2.5 2.6 0 2.8-4.3 5.6-4.6 5.6Z" fill="#3E1157"/></svg><div class="splash-name">אני כאן</div><div class="splash-dots"><i></i><i></i><i></i></div></div></div>
    <style>
      html,body{margin:0;background:#2A0A3C}
      .splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(120% 70% at 50% 35%,#5A2482 0%,#2A0A3C 62%,#1A0626 100%);color:#F4CF73;font-family:"Secular One",system-ui,sans-serif}
      .splash-glow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,201,106,.35),transparent 70%);top:calc(50% - 150px);animation:glow 1.6s ease-in-out infinite}
      .splash-pin{position:relative;animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
      .splash-name{position:relative;font-size:34px;letter-spacing:1px;text-shadow:0 0 18px rgba(240,201,106,.35)}
      .splash-dots{display:flex;gap:7px}.splash-dots i{width:7px;height:7px;border-radius:50%;background:#F0C96A;opacity:.3;animation:dot 1.2s infinite}
      .splash-dots i:nth-child(2){animation-delay:.2s}.splash-dots i:nth-child(3){animation-delay:.4s}
      .splash.out{animation:out .45s ease forwards}
      @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
      @keyframes glow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
      @keyframes dot{0%,100%{opacity:.25}40%{opacity:1}}
      @keyframes out{to{opacity:0;visibility:hidden}}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
